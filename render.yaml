# Render Blueprint: one web service serves both the API and the built React app.
# Database is MongoDB Atlas (external), so no Render disk is needed.
services:
  - type: web
    name: vs-invoice
    runtime: node
    plan: free # upgrade to "starter" to avoid cold starts after idle
    region: singapore # closest Render region to Delhi
    buildCommand: npm run render:build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false # paste your MongoDB Atlas connection string in the Render dashboard
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
